version: 2

models:
  - name: stg_diagnoses
    description: Staging table for diagnoses data, cleaned and standardized.
    columns:
      - name: diagnosis_sk
        description: Surrogate key for the diagnosis record.
        tests:
          - not_null
          - unique
      - name: diagnosis_id
        description: The natural/source ID for the diagnosis.
        tests:
          - not_null
      - name: encounter_id
        description: The natural/source ID for the patient encounter.
        tests:
          - not_null
      - name: patient_id
        description: The natural/source ID for the patient.
        tests:
          - not_null
      - name: diagnosis_code
        description: The standard medical diagnosis code (e.g., ICD-10).
      - name: description
        description: A human-readable description of the diagnosis.
      - name: diagnosis_date
        description: The date the diagnosis was made.
        tests:
          - not_null

  - name: stg_encounters
    description: Staging table for patient encounters/visits, cleaned and standardized.
    columns:
      - name: encounter_sk
        description: Surrogate key for the encounter record.
        tests:
          - not_null
          - unique
      - name: encounter_id
        description: The natural/source ID for the encounter.
        tests:
          - not_null
      - name: patient_id
        description: The natural/source ID for the patient involved in the encounter.
        tests:
          - not_null
      - name: primary_provider_id
        description: The natural/source ID for the primary care provider during this encounter.
      - name: hospital_id
        description: The natural/source ID for the hospital where the encounter occurred.
      - name: encounter_date
        description: The date of the encounter.
        tests:
          - not_null
      - name: encounter_type
        description: The type of encounter (e.g., 'Inpatient', 'Outpatient', 'ER').
      - name: length_of_stay
        description: Duration of the stay in days (for inpatient encounters).
      - name: patient_satisfaction
        description: Patient satisfaction score (1-5).
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_hospitals
    description: Staging table for hospital master data.
    columns:
      - name: hospital_sk
        description: Surrogate key for the hospital record.
        tests:
          - not_null
          - unique
      - name: hospital_id
        description: The natural/source ID for the hospital.
        tests:
          - not_null
          - unique
      - name: hospital_name
        description: Full name of the hospital.
      - name: city
        description: City where the hospital is located.
      - name: specialty
        description: Primary specialty of the hospital (e.g., 'General', 'Cardiac').

  - name: stg_patients
    description: Staging table for patient demographic information.
    columns:
      - name: patient_sk
        description: Surrogate key for the patient record.
        tests:
          - not_null
          - unique
      - name: patient_id
        description: The natural/source ID for the patient.
        tests:
          - not_null
          - unique
      - name: first_name
        description: Patient's first name.
      - name: last_name
        description: Patient's last name.
      - name: date_of_birth
        description: Patient's date of birth.
        tests:
          - not_null
      - name: gender
        description: Patient's gender (e.g., 'M', 'F', 'Other').
      - name: phone
        description: Patient's phone number, cast to a number type.
      - name: address
        description: Patient's full street address.
      - name: insurance
        description: Name of the patient's insurance provider.

  - name: stg_prescriptions
    description: Staging table for medication prescriptions.
    columns:
      - name: prescription_sk
        description: Surrogate key for the prescription record.
        tests:
          - not_null
          - unique
      - name: prescription_id
        description: The natural/source ID for the prescription.
        tests:
          - not_null
      - name: encounter_id
        description: The ID of the encounter during which the prescription was issued.
        tests:
          - not_null
      - name: patient_id
        description: The ID of the patient the prescription is for.
        tests:
          - not_null
      - name: medication
        description: Name of the medication prescribed.
      - name: dose
        description: Dosage and frequency details.
      - name: start_date
        description: Date the medication started or should start.
      - name: end_date
        description: Date the medication ended or should end.
      - name: prescribed_by
        description: Name or ID of the provider who prescribed the medication.

  - name: stg_providers
    description: Staging table for healthcare provider master data.
    columns:
      - name: provider_sk
        description: Surrogate key for the provider record.
        tests:
          - not_null
          - unique
      - name: provider_id
        description: The natural/source ID for the provider.
        tests:
          - not_null
          - unique
      - name: provider_name
        description: Full name of the provider.
      - name: specialty
        description: Provider's medical specialty (e.g., 'Cardiology', 'Pediatrics').
      - name: hospital_id
        description: ID of the hospital where the provider is affiliated.
