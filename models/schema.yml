version: 2
 
models:
 
  - name: fct_sales_daily
    description: "Fact table of daily completed orders with aggregated sales metrics."
    columns:
      - name: order_id
        description: "Order identifier (primary)."
        tests: [unique, not_null]
 
      - name: order_date
        description: "Truncated order date (day-granularity)."
        tests: [not_null]
 
      - name: net_sales
        description: "Net sales (after discounts)."
        tests:
          - not_null
 
  - name: dim_date
    description: "Date dimension table."
    columns:
      - name: date
        tests: [unique, not_null]
 
  - name: dim_store
    description: "Store dimension with region link."
    columns:
      - name: store_id
        tests: [unique, not_null]
 
sources:
  - name: raw_smartmart
    tables:
      - name: orders
      - name: order_items
 
