version: 2

models:
  - name: stg_claims_header
    columns:
      - name: claim_id
        tests: [unique, not_null]
      - name: member_id
        tests:
          - relationships:
              to: ref('stg_member_enrollment')
              field: member_id

  - name: f_revenue_daily
    description: "Daily revenue and denial summary by region/facility/provider."
    columns:
      - name: total_paid
        tests: [not_null]
      - name: pay_to_allowed_ratio
        description: "Paid/Allowed ratio (0–1+)."
