version: 2
 
sources:
  - name: raw_smartmart
    database: "{{ env_var('SMARTMART_DB', 'SMARTMART_DB') }}"  # optional: use env var for portability
    schema: RAW_SMARTMART
    tables:
      - name: customers
        description: "Raw customers table loaded from transactional system."
      - name: regions
        description: "Regional master data for stores."
      - name: stores
        description: "Store master data."
      - name: orders
        description: "Raw orders (header level)."
      - name: order_items
        description: "Raw order line items."
 
